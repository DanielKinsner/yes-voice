# cargo-deny policy. Run via `cargo xtask gate` (and enforced in CI).
# Code-license + advisory hygiene for our *dependencies*; the model-WEIGHTS
# license audit is a separate concern (plan §7.5). Our own crates are private
# (publish = false) and ignored here.

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
]
# Per-crate exceptions for the egui/eframe GUI tree (#17). All permissive /
# public-domain-equivalent; scoped to the exact crate so the global policy stays
# tight. CC0/BSL are permissive code licenses; OFL/Ubuntu-font cover the fonts
# egui bundles and are fine to redistribute in a permissive app.
exceptions = [
    { name = "hexf-parse", allow = ["CC0-1.0"] },           # hex float parsing (tiny-skia)
    { name = "error-code", allow = ["BSL-1.0"] },           # arboard clipboard dep
    { name = "clipboard-win", allow = ["BSL-1.0"] },        # arboard clipboard dep
    { name = "epaint_default_fonts", allow = ["OFL-1.1", "Ubuntu-font-1.0"] }, # bundled egui fonts
]
private = { ignore = true }
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "allow"

[advisories]
yanked = "deny"
# Accepted, documented advisories (not vulnerabilities *for us*; out of our
# control). Each is scoped to a GUI-tree transitive dep and reasoned to be
# unreachable in an offline desktop app that never parses untrusted input:
# - RUSTSEC-2026-0192: `ttf-parser` (transitive egui font-parsing dep) was
#   declared *unmaintained* by its author. Not a security hole; egui must migrate
#   to `skrifa` upstream. Ignore rather than block the whole GUI tree (#17).
# - RUSTSEC-2026-0194 / -0195: `quick-xml 0.39.4` quadratic-attribute / unbounded
#   namespace-allocation DoS. It is a *build-time* dep of `wayland-scanner`
#   (rfd → wayland-client → wayland-scanner, Linux GUI only) that parses the
#   local, trusted wayland-protocol XML shipped with the OS — never attacker-
#   controlled network input, so neither DoS is reachable. The fix needs
#   quick-xml >=0.41, but `wayland-scanner 0.31.10` pins `quick-xml = "^0.39"`,
#   so a real bump means upgrading the whole wayland/winit/rfd stack; ignore
#   until that upstream upgrade lands rather than block the GUI tree (#27).
# - RUSTSEC-2026-0370 / -0371 / -0372: zvariant, zbus_names, and
#   zvariant_derive were moved into zbus 6. These are maintenance notices.
#   The Linux screen reader adapter (AccessKit AT-SPI) still requires zbus 5.
#   Keep that adapter enabled and remove these entries when upstream adopts 6.
ignore = [
    "RUSTSEC-2026-0192",
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
    "RUSTSEC-2026-0370",
    "RUSTSEC-2026-0371",
    "RUSTSEC-2026-0372",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
