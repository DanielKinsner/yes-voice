[package]
name = "yesvox-gui"
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
name = "yesvox-gui"
path = "src/main.rs"

[features]
# The v1.0 package builds with the neural HQ engine (#20):
# `cargo build --release --features neural`.
neural = ["yesvox-core/neural"]

[dependencies]
cpal = "0.16"
eframe = "0.35.0"
rfd = "0.17.2"
yesvox-core = { path = "../yesvox-core" }
# eframe added via `cargo add` so the version resolves to the latest stable.
# cpal is the offline audio-output device for the #23 playback trust loop.
