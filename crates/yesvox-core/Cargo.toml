[package]
name = "yesvox-core"
version = "0.0.0"
edition = "2021"
publish = false

[features]
# Off by default: the high-quality MossFormer2 ONNX engine. Pulls `ort`
# (ONNX Runtime) as a native dependency, loaded dynamically at runtime so the
# default build/CI stay pure-Rust. The host-side DSP (fbank/STFT/resample) is
# always-on and golden-tested; only the neural inference sits behind this flag.
neural = ["dep:ort"]

[dependencies]
hound = "3.5"
claxon = "0.4"
flacenc = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustfft = "6"
ort = { version = "=2.0.0-rc.12", optional = true, default-features = false, features = [
    "load-dynamic",
    "ndarray",
    "std",
    "api-24",
    "tracing",
] }
