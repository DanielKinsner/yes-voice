[package]
name = "yesvox-core"
version = "0.0.0"
edition = "2021"
publish = false

[features]
# Off by default: the high-quality MossFormer2 ONNX engine. Pulls `ort`
# (ONNX Runtime) as a native dependency, loaded dynamically at runtime so the
# default build/CI stay pure-Rust. The host-side DSP (fbank/STFT/resample) is
# always-on and golden-tested; only the neural inference sits behind this flag.
neural = ["dep:ort"]

[dependencies]
hound = "3.5"
claxon = "0.4"
flacenc = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustfft = "6"
ort = { version = "=2.0.0-rc.12", optional = true, default-features = false, features = [
    "load-dynamic",
    "ndarray",
    "std",
    "api-24",
    "tracing",
] }

[dev-dependencies]
# Property lane (plan §7.7 / TESTING.md): the format/SR/channel contract and
# value-type/param-range invariants. Default-features off to avoid the `fork`/
# `timeout` (rusty-fork) subprocess machinery — pure in-process properties.
proptest = { version = "1", default-features = false, features = ["std"] }
# Local precision perf lane (#21). Default features stay off so CI compiles the
# bench target without pulling plotting/reporting extras into the normal gate.
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "render_bench"
harness = false
