name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # Cancel superseded PR runs, but never cancel a main-push run — every commit
  # on main keeps its own green/red verdict so `git bisect` stays mechanical.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    name: gate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain (from rust-toolchain.toml)
        run: rustup show
      - name: Install ALSA dev headers (Linux, for cpal playback)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Gate (fmt + clippy -D warnings + test + deny)
        run: cargo xtask gate

  # The high-quality neural engine (`neural` feature) pulls `ort` and is not in
  # the pure-Rust gate above. Compile + clippy it here so the feature-gated code
  # can never rot. `ort` is `load-dynamic`, so this neither downloads nor links a
  # native library; the runtime + weights are only needed to *run* the ignored
  # integration test, which is intentionally not part of CI.
  neural-build:
    name: neural feature (compile-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain (from rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Clippy the neural feature (-D warnings)
        run: cargo clippy -p yesvox-core --features neural --all-targets -- -D warnings

  # Cross-platform whole-chain determinism (#34): the same-machine + worker-count
  # byte-identity checks are a HARD gate (they run inside `cargo test` above on
  # all three OSes). This job additionally *records* the render fingerprint per
  # OS so cross-platform agreement can be compared from the logs — informational
  # first (see docs/TESTING.md); promote to a hard cross-OS golden once the three
  # agree, or pin per-platform goldens if they drift. Scoped to yesvox-core so no
  # GUI/audio system libs are needed.
  determinism-fingerprint:
    name: determinism fingerprint (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain (from rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Render + print the determinism fingerprint
        run: cargo test -p yesvox-core --test determinism cross_platform_fingerprint -- --nocapture
